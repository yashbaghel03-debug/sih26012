[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26012"
version = "0.1.0"
description = "SIH 2026 Parcel Assignment and WebGIS API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.111.0",
  "uvicorn[standard]==0.30.1",
  "python-dotenv==1.0.1",
  "geopandas==0.14.4",
  "shapely==2.0.4",
  "pyproj==3.6.1",
  "psycopg2-binary==2.9.9",
  "pydantic==2.7.1",
  "httpx==0.27.0",
  "python-multipart==0.0.9",
]

[tool.vercel]
entrypoint = "backend.api.main:app"

[tool.setuptools.packages.find]
include = ["backend*"]
