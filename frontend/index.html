<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIH 26012 — India WebGIS</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="map.css">
</head>
<body>
  <div id="map"></div>
  <div class="map-search">
    <div class="search-title">India WebGIS</div>
    <form id="aluSearchForm" class="search-form" autocomplete="off">
      <input id="aluSearch" type="search" placeholder="Search ALU, e.g. ALU-1km-xp0-yp0" aria-label="Search ALU">
      <button type="submit">Search</button>
    </form>
    <div id="searchHint" class="search-hint">Search an ALU to fly to it.</div>
  </div>
  <div class="map-actions"><a href="admin.html">Admin</a></div>
  <div id="cellTooltip" class="cell-tooltip hidden"></div>
  <div id="searchResult" class="search-result hidden"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>
  <script src="map.js"></script>
</body>
</html>
